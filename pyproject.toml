[project]
name = "offerpilot"
version = "1.0.0rc4"
description = "Local-first recruitment task assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.18",
  "keyring>=25,<26",
  "tzdata>=2025.1",
  "beautifulsoup4>=4.12,<5",
  "pystray>=0.19,<1",
  "pillow>=11,<13",
  "windows-toasts>=1.3,<2; sys_platform == 'win32'",
  "pywebview>=6,<7 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    "pyinstaller>=6,<7",
    "websocket-client>=1.8,<2",
    "icalendar>=6,<8",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
